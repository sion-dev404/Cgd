<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>번호 뽑기 1~24</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>
:root{
  --bg:#FFD23F; --ink:#1B1F3B; --ball:#FFFFFF; --accent:#E63946; --btn-ink:#FFFFFF;
  --cell:#FFEFB0; --cell-ink:#9C8A45; --done:#1B1F3B; --done-ink:#FFD23F;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15182E; --ink:#FFE9A8; --ball:#232845; --accent:#FF4D5E; --btn-ink:#FFFFFF;
    --cell:#21254A; --cell-ink:#6E74A3; --done:#FFD23F; --done-ink:#15182E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15182E; --ink:#FFE9A8; --ball:#232845; --accent:#FF4D5E; --btn-ink:#FFFFFF;
  --cell:#21254A; --cell-ink:#6E74A3; --done:#FFD23F; --done-ink:#15182E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Black Han Sans',"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:clamp(14px,3vh,30px); padding:16px; min-height:100%; height:auto;
}
.ball{
  width:min(64vw,44vh,380px); aspect-ratio:1; border-radius:50%;
  background:var(--ball); border:clamp(8px,1.6vw,14px) solid var(--ink);
  display:grid; place-items:center; line-height:1;
  font-size:min(34vw,24vh,210px); font-variant-numeric:tabular-nums;
}
.ball.empty{font-size:min(22vw,15vh,130px); color:var(--cell-ink)}
.ball.rolling{color:var(--cell-ink)}
.ball.pop{animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.draw{
  font:inherit; font-size:clamp(34px,8vw,60px); line-height:1;
  padding:.4em 1.5em; border:none; border-radius:999px;
  background:var(--accent); color:var(--btn-ink);
  box-shadow:0 8px 0 var(--ink); cursor:pointer;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.draw:active:not(:disabled){transform:translateY(6px); box-shadow:0 2px 0 var(--ink)}
.draw:disabled{opacity:.55; cursor:default}
.draw:focus-visible,.reset:focus-visible{outline:4px solid var(--ink); outline-offset:6px}
.status{font-size:clamp(18px,3.6vw,26px); margin:0}
.board{display:grid; grid-template-columns:repeat(8,1fr); gap:6px; width:min(100%,560px)}
@media (max-width:480px){.board{grid-template-columns:repeat(6,1fr)}}
.cell{
  aspect-ratio:1; display:grid; place-items:center; border-radius:10px;
  background:var(--cell); color:var(--cell-ink); font-size:clamp(17px,4.4vw,24px);
}
.cell.done{background:var(--done); color:var(--done-ink)}
.cell.last{outline:3px solid var(--accent); outline-offset:2px}
.reset{
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; font-weight:700;
  font-size:16px; padding:.55em 1.3em; border-radius:999px; cursor:pointer;
  background:transparent; color:var(--ink); border:2px solid var(--ink);
}
.reset.armed{background:var(--accent); border-color:var(--accent); color:var(--btn-ink)}
@media (prefers-reduced-motion:reduce){.ball.pop{animation:none}}
</style>
</head>
<body>
  <div class="ball empty" id="ball" aria-live="polite">?</div>
  <button class="draw" id="draw">뽑기!</button>
  <p class="status" id="status">남은 번호 24개</p>
  <div class="board" id="board" aria-label="뽑힌 번호"></div>
  <button class="reset" id="reset">처음부터 다시</button>

<script>
const MAX = 24;
const ballEl = document.getElementById('ball');
const drawBtn = document.getElementById('draw');
const statusEl = document.getElementById('status');
const boardEl = document.getElementById('board');
const resetBtn = document.getElementById('reset');
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let drawn = [];
let rolling = false;

try {
  const saved = JSON.parse(localStorage.getItem('draw24') || '[]');
  if (Array.isArray(saved)) drawn = saved.filter(n => Number.isInteger(n) && n >= 1 && n <= MAX);
} catch (e) {}

function save(){ try { localStorage.setItem('draw24', JSON.stringify(drawn)); } catch (e) {} }
function remaining(){ const s = new Set(drawn); return Array.from({length:MAX},(_,i)=>i+1).filter(n=>!s.has(n)); }

const cells = [];
for (let i = 1; i <= MAX; i++) {
  const c = document.createElement('div');
  c.className = 'cell'; c.textContent = i;
  boardEl.appendChild(c); cells.push(c);
}

function render(){
  const last = drawn[drawn.length - 1];
  cells.forEach((c, i) => {
    const n = i + 1;
    c.classList.toggle('done', drawn.includes(n));
    c.classList.toggle('last', n === last);
  });
  const left = MAX - drawn.length;
  if (!rolling) {
    if (last) { ballEl.textContent = last; ballEl.classList.remove('empty'); }
    else { ballEl.textContent = '?'; ballEl.classList.add('empty'); }
  }
  statusEl.textContent = left ? `남은 번호 ${left}개` : '모든 번호를 뽑았어요';
  drawBtn.disabled = rolling || left === 0;
  drawBtn.textContent = left ? '뽑기!' : '끝!';
}

function draw(){
  const pool = remaining();
  if (!pool.length || rolling) return;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  const finish = () => {
    rolling = false;
    drawn.push(pick); save();
    ballEl.classList.remove('rolling','empty','pop');
    void ballEl.offsetWidth;
    ballEl.classList.add('pop');
    render();
  };
  if (reduce || pool.length === 1) { finish(); return; }
  rolling = true; render();
  ballEl.classList.remove('empty'); ballEl.classList.add('rolling');
  let t = 0;
  const id = setInterval(() => {
    ballEl.textContent = pool[Math.floor(Math.random() * pool.length)];
    t += 60;
    if (t >= 900) { clearInterval(id); finish(); }
  }, 60);
}

let armTimer = null;
resetBtn.addEventListener('click', () => {
  if (rolling) return;
  if (!resetBtn.classList.contains('armed')) {
    resetBtn.classList.add('armed');
    resetBtn.textContent = '한 번 더 누르면 초기화';
    armTimer = setTimeout(() => { resetBtn.classList.remove('armed'); resetBtn.textContent = '처음부터 다시'; }, 3000);
    return;
  }
  clearTimeout(armTimer);
  resetBtn.classList.remove('armed'); resetBtn.textContent = '처음부터 다시';
  drawn = []; save(); render();
});

drawBtn.addEventListener('click', draw);
render();
</script>
</body>
</html>
